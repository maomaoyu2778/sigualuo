<div class="wrap">
  <h1>丝瓜络：空心里长出的网</h1>
  <p class="sub">一根丝瓜络的互动科普页。数据来自本人实测（总长 42.5 cm、干重 18.6 g、三室孔洞 17 / 19 / 16）与公开文献。两个版本，点开就能玩。</p>

  <a class="card" href="jiaohu.html">
    <div class="t">版本一 · 丝瓜络数据交互页</div>

    <div class="go">点开玩 →</div>

  <a class="card" href="huzhao.html">
    <div class="t">版本二 · 丝瓜络探索护照</div>
    <div class="d">把整页变成一本集章册：边探索边完成发现任务，集齐印章，还有一生的故事线和刷洗互动。</div>
    <div class="go">点开玩 →</div>
  </a>

  <p class="foot">设计基础 · 数据叙事作业。页面为单个文件，无需登录，手机浏览器直接打开。</p>
